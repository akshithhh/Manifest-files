apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bb-statefulset

spec:
  serviceName: bb-statefulset
  replicas: 1

  selector:
    matchLabels:
      app: bb-stateful-app

  template:
    metadata:
      labels:
        app: bb-stateful-app

    spec:
      containers:
        - name: bb-stateful-container
          image: 465760686497.dkr.ecr.us-east-1.amazonaws.com/myrepo:1.0-db

          ports:
            - containerPort: 3306

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
